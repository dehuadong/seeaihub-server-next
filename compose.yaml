services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: seeai
      POSTGRES_PASSWORD: seeai
      POSTGRES_DB: seeai_next
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seeai -d seeai_next"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - seeai-postgres:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - seeai-minio:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://minio:9000 minio minio-secret;
      do sleep 1; done;
      mc mb --ignore-existing local/seeai-assets"

volumes:
  seeai-postgres:
  seeai-minio:
