services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: seeai
      POSTGRES_PASSWORD: seeai
      POSTGRES_DB: seeai_next
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seeai -d seeai_next"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - seeai-postgres:/var/lib/postgresql/data

volumes:
  seeai-postgres:
