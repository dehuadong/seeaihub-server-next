[workspace]
members = [
  "apps/api",
  "apps/worker",
  "crates/domain",
  "crates/application",
  "crates/adapter-sdk",
  "crates/adapter-aihubmix",
  "crates/adapter-apimart",
  "crates/adapter-object-storage",
  "crates/persistence",
  "crates/cache-redis",
  "crates/alert-webhook",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["password-hash"] }
async-trait = "0.1.92"
aws-lc-rs = "1.18.1"
axum = { version = "0.8.9", features = ["http2", "json", "multipart", "tokio"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = "0.3.32"
h2 = "0.4.19"
http = "1.4.0"
hex = "0.4.3"
hmac = "0.13.0"
hyper = { version = "1.11.1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "service", "tokio"] }
jsonschema = { version = "0.56.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }
rustix = { version = "1.1.4", features = ["event", "net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
unicode-general-category = "1.1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

# 开发与测试 profile：**依赖不留调试信息**，自己的 crate 只留"文件:行号"。
#
# 为什么：默认 `debug = 2` 把每个依赖的完整调试信息写进 `target/debug`，这类工作区里它是磁盘占用
# 的主要来源（十几 GB），链接与写盘也随它变慢；`line-tables-only` 足够让 panic 回溯指到自己代码的
# 行号。要钻进依赖里单步调试时，临时把这两段去掉再编一次即可（会触发一次依赖重编）。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
